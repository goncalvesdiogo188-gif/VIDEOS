# Compila o jogo no GitHub sempre que há alterações em futebol-carreira/.
# No fim, guarda o APK em futebol-carreira/apk/futebol-carreira.apk.
name: Compilar APK

on:
  push:
    paths:
      - "futebol-carreira/**"
      - ".github/workflows/compilar-apk.yml"
      - "!futebol-carreira/apk/**"
      - "!futebol-carreira/capturas/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: futebol-carreira
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # O ecrã Godot usa o ficheiro .pck já exportado e guardado no repositório
      # (godot/ → app/src/main/assets/godot/ao_vivo.pck), por isso o GitHub não precisa do Godot.
      - name: Verificar o .pck do Godot
        run: test -s app/src/main/assets/godot/ao_vivo.pck

      - name: Testes do núcleo e compilação do APK
        run: ./gradlew --console=plain :nucleo:test :app:assembleRelease

      - name: Guardar o APK como ficheiro da execução
        uses: actions/upload-artifact@v4
        with:
          name: futebol-carreira-apk
          path: futebol-carreira/app/build/outputs/apk/release/app-release.apk

      - name: Guardar o APK no repositório
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/release/app-release.apk apk/futebol-carreira.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/futebol-carreira.apk
          git diff --cached --quiet || git commit -m "APK compilado automaticamente [skip ci]"
          git push

      # Percorre a aplicação num telemóvel simulado e guarda imagens dos ecrãs.
      # Se isto falhar, o APK já ficou guardado no passo anterior.
      - name: Testar os ecrãs e tirar capturas
        continue-on-error: true
        run: ./gradlew --console=plain :app:testDebugUnitTest

      - name: Guardar as capturas no repositório
        run: |
          if ls app/build/outputs/roborazzi/*.png >/dev/null 2>&1; then
            mkdir -p capturas
            find capturas -type f ! -name 'godot-*' -delete   # mantém as capturas do Godot (feitas à mão)
            cp app/build/outputs/roborazzi/*.png capturas/
            git add -A capturas
            git diff --cached --quiet || git commit -m "Capturas dos ecrãs [skip ci]"
            git push
          fi
